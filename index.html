<head>

  <style>
    :root {
      --orange: #ED931B;
      --cream: #F8F7F3;
      --dark: #363636;
      --blue: #334FB4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--dark);
      font-family: "Source Sans 3", sans-serif;
    }

    header {
      background: white;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 1px solid #e9e5df;
    }

    .logo {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .logo span { color: var(--orange); }

    main {
      width: min(100% - 32px, 580px);
      margin: 38px auto 70px;
    }

    .eyebrow {
      color: var(--blue);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 42px);
      line-height: 1.1;
      margin: 12px 0;
    }

    .intro {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .panel {
      background: white;
      border: 1px solid #e9e5df;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 30px #3636360a;
    }

    .progress {
      height: 7px;
      background: #eeeae3;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress div {
      height: 100%;
      width: 25%;
      background: var(--orange);
      transition: width .2s;
    }

    .step-label {
      font-size: 13px;
      color: #777;
      font-weight: 700;
    }

    h2 {
      font-size: 27px;
      line-height: 1.2;
      margin: 12px 0 24px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice {
      background: var(--cream);
      color: var(--dark);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 20px 10px;
      min-height: 75px;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .choice:hover, .choice:focus-visible {
      border-color: var(--orange);
      outline: none;
    }

    .choice.selected {
      border-color: var(--orange);
      background: #fff4e4;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .back, .next {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .back { background: #eeeae3; }

    .next {
      flex: 1;
      background: var(--orange);
      color: #292929;
    }

    .next:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .result {
      background: var(--cream);
      padding: 18px;
      border-radius: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      main { margin-top: 25px; }
      .panel { padding: 19px; }
      .choices { gap: 9px; }
      .choice { font-size: 15px; }
    }
  </style>
</head>

    let catalogRequest;
    async function loadCatalog() {
      const cacheKey = "pet-printed-catalog-v1";
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
        if (cached && Date.now() - cached.savedAt < 120000 && Array.isArray(cached.data.products)) return cached.data;
      } catch (_) {}
      if (!catalogRequest) {
        catalogRequest = (async () => {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 15000);
          try {
            const response = await fetch(CATALOG_API_URL, {signal: controller.signal});
            if (!response.ok) throw new Error("Catalog request failed");
            const data = await response.json();
            if (!Array.isArray(data.products)) throw new Error("Invalid catalog response");
            try { sessionStorage.setItem(cacheKey, JSON.stringify({savedAt: Date.now(), data})); } catch (_) {}
            return data;
          } finally { clearTimeout(timeout); }
        })();
      }
      try { return await catalogRequest; } finally { catalogRequest = undefined; }
    }

    function render() {
      progress.style.width =
        Math.min((step + 1) / questions.length * 100, 100) + "%";

      if (step >= questions.length) {
        renderSummary();
        return;
      }

      const question = questions[step];

      content.innerHTML = `
        <div class="step-label">
          QUESTION ${step + 1} OF ${questions.length}
        </div>
        <h2>${question.title}</h2>
        <div class="choices" id="choices"></div>
        <div class="actions">
          ${step > 0
            ? '<button class="back" id="back">Back</button>'
            : ''}
          <button class="next" id="next" disabled>
            ${step === questions.length - 1
              ? 'Find my gifts'
              : 'Continue'}
          </button>
        </div>
      `;

      const choices = document.getElementById("choices");
      const next = document.getElementById("next");

      question.options.forEach(option => {
        const button = document.createElement("button");
        button.className = "choice";
        button.type = "button";
        button.textContent = option;

        if (answers[question.key] === option) {
          button.classList.add("selected");
          next.disabled = false;
        }

        button.addEventListener("click", () => {
          answers[question.key] = option;

          choices.querySelectorAll(".choice").forEach(item => {
            item.classList.remove("selected");
          });

          button.classList.add("selected");
          next.disabled = false;
        });

        choices.appendChild(button);
      });

      next.addEventListener("click", () => {
        if (!answers[question.key]) return;
        step++;
        render();
      });

      if (step > 0) {
        document.getElementById("back")
          .addEventListener("click", () => {
            step--;
            render();
          });
      }
    }


async function renderSummary() {
  content.innerHTML = `
    <div class="step-label">ALL DONE</div>
    <h2>We've got the picture!</h2>
    <div class="result">
      <p id="summary"></p>
      <div id="recommendations">
        Finding your perfect gifts...
      </div>
    </div>
    <div class="actions">
      <button class="back" id="restart">
        Start again
      </button>
    </div>
  `;

  document.getElementById("summary").textContent =
    `Shopping for: ${answers.recipient}. ` +
    `Pet: ${answers.animal}. ` +
    `Occasion: ${answers.occasion}. ` +
    `Budget: ${answers.budget}.`;

  document.getElementById("restart")
    .addEventListener("click", () => {
      const cleanUrl = new URL(location.href);
      questions.forEach(question => cleanUrl.searchParams.delete(question.key));
      history.replaceState(null, "", cleanUrl);
      step = 0;
      Object.keys(answers).forEach(
        key => delete answers[key]
      );
      render();
    });

  const resultUrl = new URL(location.href);
  questions.forEach(question => resultUrl.searchParams.set(question.key, answers[question.key]));
  history.replaceState(null, "", resultUrl);
  const container = document.getElementById("recommendations");

  try {
    const data = await loadCatalog();
    if (!container.isConnected) return;
    const products = Array.isArray(data.products) ? data.products : [];

    const normalize = value => String(value ?? "").trim().toLowerCase();
    const animal = normalize(answers.animal);
    const occasion = answers.occasion === "Remembering a pet" ? "memorial" : normalize(answers.occasion);
    const recipient = normalize(answers.recipient);
    const budget = answers.budget;

    // Treat the selected range as a preference, not a strict minimum spend.
    const minPrice = budget === "$25–$50" ? 25 : budget === "$50+" ? 50 : 0;
    const maxPrice = budget === "Under $25" ? 25 : budget === "$25–$50" ? 50 : Infinity;
    const priceOf = product => {
      const value = product.price;
      if (typeof value !== "number" && typeof value !== "string") return NaN;
      if (typeof value === "string" && !value.trim()) return NaN;
      return Number(value);
    };
    const priceTier = product => {
      if (budget === "Surprise me") return 0;
      const price = priceOf(product);
      if (price >= minPrice && (budget === "Under $25" ? price < maxPrice : price <= maxPrice)) return 0; // Preferred range
      if (price < minPrice) return 1; // Cheaper, still suitable
      return 2; // Above stated spending limit
    };

    const animalTags = product => normalize(product.animal)
      .split(/[,;|]/).map(tag => tag.trim())
      .map(tag => tag === "bunny" ? "rabbit" : tag).filter(Boolean);
    const animalMatches = product => {
      const tags = animalTags(product);
      return tags.includes(animal) ||
        tags.some(tag => ["any", "all", "any animal", "all pets"].includes(tag));
    };

    // Only show items for the selected occasion or genuinely all-purpose gifts.
    // For example, Father's Day must not appear in Birthday recommendations.
    const occasionMatches = product => {
      const tag = normalize(product.occasion);
      if (occasion === "memorial") return tag === "memorial";
      return tag === occasion || ["any occasion", "any", "all"].includes(tag);
    };

    const isStoreProduct = product => {
      try {
        const url = new URL(product.url);
        return url.protocol === "https:" && url.hostname === "pet-printed.com" &&
          /^\/products\/[^/]+\/?$/.test(url.pathname);
      } catch (_) { return false; }
    };
    const isAllowed = value => value === undefined || value === true || normalize(value) === "true";
    // This adult-innuendo design needs an explicit humor preference, which
    // the current questionnaire does not collect. Keep general picks suitable.
    const broadAudienceExcluded = new Set(["/products/personalized-mug-not-from-your-sack"]);
    const eligible = products.filter(product =>
      product && product.name && isStoreProduct(product) &&
      !broadAudienceExcluded.has(new URL(product.url).pathname.replace(/\/$/, "")) &&
      isAllowed(product.eligible) && isAllowed(product.available) && animalMatches(product) &&
      occasionMatches(product) && Number.isFinite(priceOf(product)) &&
      priceOf(product) > 0
    );

    const score = product => {
      const selectedAnimalSupported = animalTags(product).includes(animal);
      const occasionTag = normalize(product.occasion);
      const recipientTag = normalize(product.recipient);
      let points = selectedAnimalSupported ? 10 : 0;
      if (occasionTag === occasion) points += 80;
      else if (["any occasion", "any", "all"].includes(occasionTag)) points += 8;
      if (recipientTag === recipient) points += 12;
      else if (["pet lover", "any", "all"].includes(recipientTag)) points += 5;
      return points;
    };

    const reviewedImageAnimals = product => {
      const evidence = imageAnimalEvidence[String(product.id)];
      return evidence && evidence.image === product.image ? evidence.animals.map(normalize) : [];
    };
    const imageTier = product => {
      if (animal === "other / not sure") return 0;
      const shown = reviewedImageAnimals(product);
      return shown.includes(animal) ? 0 : shown.length ? 2 : 1;
    };

    const sortByRelevance = (a, b) => score(b) - score(a) ||
      priceOf(a) - priceOf(b);

    // Prefer the chosen range, then less expensive gifts, then above-budget
    // alternatives only if nothing affordable is available.
    const preferred = eligible.filter(p => priceTier(p) === 0).sort(sortByRelevance);
    const cheaper = eligible.filter(p => priceTier(p) === 1).sort(sortByRelevance);
    const expensive = eligible.filter(p => priceTier(p) === 2)
      .sort((a, b) => priceOf(a) - priceOf(b) || sortByRelevance(a, b));
    const affordable = [...preferred, ...cheaper];

    // Keep only one recommendation per product page, even if catalog rows
    // contain different variant links or tracking query parameters.
    const uniqueProducts = items => {
      const seen = new Set();
      return items.filter(product => {
        let key;
        try {
          const url = new URL(product.url);
          key = (url.origin + url.pathname).replace(/\/$/, "").toLowerCase();
        } catch (_) {
          key = String(product.url).split(/[?#]/)[0].replace(/\/$/, "").toLowerCase();
        }
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    };
    const diversePicks = items => {
      const unique = uniqueProducts(items);
      const chosen = [], selected = new Set(), types = new Map();
      const add = product => {
        if (chosen.length >= 6 || selected.has(product)) return;
        chosen.push(product); selected.add(product);
        const type = normalize(product.type || product.productType || "gift");
        types.set(type, (types.get(type) || 0) + 1);
      };
      // Matching sample animals first, unknown images next, other animals last.
      // Keep all compatible products; prefer variety within each visual tier.
      for (const tier of [0, 1, 2]) {
        const group = unique.filter(product => imageTier(product) === tier);
        group.forEach(product => {
          const type = normalize(product.type || product.productType || "gift");
          if (!types.has(type)) add(product);
        });
        group.forEach(product => {
          const type = normalize(product.type || product.productType || "gift");
          if ((types.get(type) || 0) < 2) add(product);
        });
        group.forEach(add);
      }
      return chosen;
    };
    const pool = affordable.length ? affordable : expensive;
    const occasionSpecific = pool.filter(p => normalize(p.occasion) === occasion);
    const occasionGeneral = pool.filter(p => normalize(p.occasion) !== occasion);
    const selectPicks = items => {
      const unique = uniqueProducts(items), chosen = [];
      // Animal relevance comes first among already occasion-compatible gifts.
      // Retain exact occasion priority within each visual tier, on every page.
      for (const tier of [0, 1, 2]) {
        const group = unique.filter(product => imageTier(product) === tier);
        const exact = diversePicks(group.filter(product => normalize(product.occasion) === occasion));
        const general = diversePicks(group.filter(product => normalize(product.occasion) !== occasion));
        chosen.push(...[...exact, ...general].slice(0, 6 - chosen.length));
      }
      return chosen;
    };
    const matches = selectPicks(pool);
    const showingAboveBudget = matches.some(p => priceTier(p) === 2);

    container.textContent = "";

    if (!matches.length) {
      container.textContent =
        "We don't have suitable gifts for this pet and occasion in the current catalog yet. Try another occasion or pet type.";
      return;
    }

    const heading = document.createElement("h3");
    heading.textContent = "Your personalized gift picks";
    container.appendChild(heading);

    if (showingAboveBudget) {
      const note = document.createElement("p");
      note.textContent =
        "No gifts at or below your selected spending limit are available for this pet and occasion. These alternatives start above your budget.";
      container.appendChild(note);
    } else if (budget === "$25–$50" && !preferred.length && cheaper.length) {
      const note = document.createElement("p");
      note.textContent =
        "No gifts start within $25–$50 for this pet and occasion, but these lower-priced options may be a great fit.";
      container.appendChild(note);
    } else if (budget === "$50+" && !preferred.length && cheaper.length) {
      const note = document.createElement("p");
      note.textContent =
        "No gifts start at $50 or more for this pet and occasion, but these lower-priced options may be a great fit.";
      container.appendChild(note);
    }

    const visualNote = document.createElement("p");
    if (animal === "other / not sure") {
      visualNote.textContent = "Your pet type isn't specified, so we can't match the sample animal. Check your pet's personalization options in the store before ordering.";
    } else if (!pool.some(product => imageTier(product) === 0)) {
      visualNote.textContent = "No reviewed " + animal + " previews are available for this pet, occasion and budget. These compatible options show other animals or unverified samples. Check your pet's personalization options in the store before ordering.";
    } else {
      visualNote.textContent = "Matching animal previews are prioritized; occasion-specific designs come first within each visual group. Other compatible options are labelled when the sample shows a different animal. Check personalization options in the store before ordering.";
    }
    container.appendChild(visualNote);

    const priceNote = document.createElement("p");
    priceNote.textContent = "Prices are in USD. Sizes and options can cost more; shipping and taxes are extra. Check the store before ordering.";
    container.appendChild(priceNote);
    if (matches.length > 1 && new Set(matches.map(p => normalize(p.type || p.productType || "gift"))).size === 1) {
      const varietyNote = document.createElement("p");
      varietyNote.textContent = "Our verified picks for this pet and occasion are currently limited to one kind of gift.";
      container.appendChild(varietyNote);
    }
    const grid = document.createElement("div");
    grid.style.cssText =
      "display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:16px;margin-top:20px;";

    const addCard = product => {
      const card = document.createElement("div");
      card.style.cssText =
        "background:white;border:1px solid #eee;border-radius:14px;padding:14px;";

      const img = document.createElement("img");
      img.src = product.image;
      const shownAnimals = reviewedImageAnimals(product);
      img.alt = product.name + (shownAnimals.length ? " — sample showing " + shownAnimals.join(" and ") : " — sample design");
      img.loading = "lazy";
      img.style.cssText =
        "width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;";

      const visualBadge = document.createElement("p");
      visualBadge.textContent = animal === "other / not sure"
        ? (shownAnimals.length ? "Sample: " + shownAnimals.join(" and ") + ". Pet type not specified." : "Sample animal not verified. Pet type not specified.")
        : shownAnimals.includes(animal)
          ? answers.animal + " shown in sample"
          : shownAnimals.length
            ? "Different animal shown: " + shownAnimals.join(" and ")
            : "Sample animal not verified";
      visualBadge.style.cssText = "font-size:14px;font-weight:700;padding:7px 9px;border-radius:8px;background:" +
        (animal !== "other / not sure" && shownAnimals.includes(animal) ? "#e6f4e8" : "#fff0d9") + ";";

      const name = document.createElement("h4");
      name.textContent = product.name;

      const price = document.createElement("p");
      const tier = priceTier(product);
      price.textContent =
        (normalize(product.priceType) === "fixed" ? "$" : "From $") + priceOf(product).toFixed(2) +
        (tier === 1 ? " · Great value" :
         tier === 2 ? " · Above selected budget" : "");

      const link = document.createElement("a");
      link.href = product.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "View gift";
      link.style.cssText =
        "display:block;background:#ED931B;color:#111;text-align:center;padding:12px;border-radius:9px;text-decoration:none;font-weight:bold;";

      const reason = document.createElement("p");
      const petLabel = animal === "other / not sure" ? "pet" : animal;
      reason.textContent = occasion === "memorial"
        ? "A personalized keepsake for remembering their pet."
        : normalize(product.occasion) === "christmas"
          ? "A Christmas design for someone who loves their " + petLabel + "."
          : "A personalized gift for someone who loves their " + petLabel + ".";
      if (animal !== "other / not sure" && !shownAnimals.includes(animal)) {
        const sampleNote = document.createElement("p");
        sampleNote.textContent = shownAnimals.length
          ? "Sample shows " + shownAnimals.join(" and ") + ". Check " + petLabel + " customization options in the store."
          : "Sample animal not verified. Check " + petLabel + " customization options in the store.";
        sampleNote.style.cssText = "font-size:14px;color:#555;";
        reason.textContent = occasion === "memorial"
          ? "A keepsake option for remembering their pet. Check the available personalization in the store."
          : "A gift option for a " + petLabel + " lover. Check the available personalization in the store.";
        card.append(img, visualBadge, name, reason, sampleNote, price, link);
      } else {
        card.append(img, visualBadge, name, reason, price, link);
      }
      grid.appendChild(card);
    };
    matches.forEach(addCard);

    container.appendChild(grid);
    let remaining = uniqueProducts([...occasionSpecific, ...occasionGeneral]).filter(p => !matches.includes(p));
    if (remaining.length) {
      const more = document.createElement("button");
      more.type = "button"; more.className = "back"; more.textContent = "More gift options";
      more.style.marginTop = "16px";
      more.addEventListener("click", () => {
        const nextPicks = selectPicks(remaining);
        nextPicks.forEach(addCard);
        remaining = remaining.filter(p => !nextPicks.includes(p));
        if (!remaining.length) more.remove();
      });
      container.appendChild(more);
    }

  } catch (error) {
    console.error("Gift finder error:", error);
    container.textContent =
      "We couldn't load the gift catalog. Please try again.";
    if (container.isConnected) {
      const retry = document.createElement("button");
      retry.type = "button"; retry.className = "back"; retry.textContent = "Try again";
      retry.addEventListener("click", () => renderSummary()); container.appendChild(retry);
    }
  }
}

    const requested = new URLSearchParams(location.search);
    if (questions.every(question => question.options.includes(requested.get(question.key)))) {
      questions.forEach(question => { answers[question.key] = requested.get(question.key); });
      step = questions.length;
    }
    render();
  </script>
</body>
</html>
